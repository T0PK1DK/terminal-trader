<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERMINAL TRADER</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #000;
  color: #0f0;
  font-family: 'Courier New', Courier, monospace;
  font-size: 14px;
  line-height: 1.4;
  overflow-x: hidden;
  position: relative;
}
body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 255, 0, 0.03) 0px,
    rgba(0, 255, 0, 0.03) 1px,
    transparent 1px,
    transparent 2px
  );
  pointer-events: none;
  z-index: 9999;
}
#app {
  max-width: 1000px;
  margin: 0 auto;
  padding: 12px;
}
h1 {
  text-align: center;
  font-size: 24px;
  letter-spacing: 4px;
  margin-bottom: 8px;
  text-shadow: 0 0 8px #0f0;
}
.stats {
  display: flex;
  justify-content: space-around;
  background: #001100;
  border: 1px solid #0f0;
  padding: 8px;
  margin-bottom: 12px;
  font-weight: bold;
}
.positive { color: #0f0; }
.negative { color: #f44; }
#stocks {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 8px;
  margin-bottom: 12px;
}
.stock-card {
  background: #001100;
  border: 1px solid #0a0;
  padding: 8px;
  cursor: pointer;
  transition: all 0.2s;
}
.stock-card:hover, .stock-card.selected {
  border-color: #0f0;
  background: #002200;
  box-shadow: 0 0 8px #0f0;
}
.stock-card .symbol { font-size: 16px; font-weight: bold; }
.stock-card .price { font-size: 18px; }
.stock-card .change { font-size: 12px; }
#chart-container {
  background: #001100;
  border: 1px solid #0f0;
  margin-bottom: 12px;
  height: 180px;
  position: relative;
}
#chart { width: 100%; height: 100%; display: block; }
.chart-label {
  position: absolute;
  top: 4px; left: 8px;
  font-size: 12px;
  opacity: 0.8;
}
.trade-panel {
  display: flex;
  gap: 8px;
  align-items: center;
  background: #001100;
  border: 1px solid #0f0;
  padding: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.trade-panel select, .trade-panel input, .trade-panel button {
  background: #000;
  color: #0f0;
  border: 1px solid #0f0;
  padding: 6px 10px;
  font-family: inherit;
  font-size: 14px;
}
.trade-panel button {
  cursor: pointer;
  font-weight: bold;
}
.trade-panel button:hover { background: #0f0; color: #000; }
.trade-panel button:disabled { opacity: 0.5; cursor: not-allowed; }
#news {
  background: #110000;
  border: 1px solid #f44;
  color: #f88;
  padding: 8px;
  margin-bottom: 12px;
  min-height: 36px;
  font-style: italic;
}
#log {
  background: #001100;
  border: 1px solid #0a0;
  padding: 8px;
  height: 140px;
  overflow-y: auto;
  font-size: 12px;
}
.log-entry { margin-bottom: 2px; }
.controls {
  text-align: center;
  margin-bottom: 12px;
}
.controls button {
  background: #000;
  color: #0f0;
  border: 1px solid #0f0;
  padding: 6px 16px;
  margin: 0 4px;
  font-family: inherit;
  cursor: pointer;
}
.controls button.active { background: #0f0; color: #000; }
.goal {
  text-align: center;
  margin: 8px 0;
  font-size: 12px;
  opacity: 0.8;
}
@media (max-width: 600px) {
  .stats { flex-direction: column; gap: 4px; text-align: center; }
  .trade-panel { flex-direction: column; align-items: stretch; }
}
</style>
</head>
<body>
<div id="app">
  <h1>TERMINAL TRADER</h1>
  <div class="goal">STARTING CAPITAL: $10,000 &nbsp;|&nbsp; GOAL: $100,000</div>
  <div class="stats">
    <div>CASH: $<span id="cash">10000.00</span></div>
    <div>HOLDINGS: $<span id="holdings">0.00</span></div>
    <div>TOTAL: $<span id="total">10000.00</span></div>
    <div>DAY: <span id="day">1</span></div>
  </div>

  <div class="controls">
    <button id="speed1" class="active" onclick="setSpeed(1)">1x</button>
    <button id="speed2" onclick="setSpeed(2)">2x</button>
    <button id="speed5" onclick="setSpeed(5)">5x</button>
    <button onclick="pauseResume()">PAUSE</button>
  </div>

  <div id="stocks"></div>

  <div id="chart-container">
    <div class="chart-label" id="chartLabel">SELECT A STOCK</div>
    <canvas id="chart"></canvas>
  </div>

  <div class="trade-panel">
    <select id="stockSelect" onchange="selectStock(this.value)"></select>
    <input type="number" id="qty" value="1" min="1" step="1" style="width:80px">
    <button id="buyBtn" onclick="buy()">BUY</button>
    <button id="sellBtn" onclick="sell()">SELL</button>
    <span id="maxBuy" style="margin-left:8px; font-size:12px;"></span>
  </div>

  <div id="news">MARKET OPEN. Awaiting events...</div>
  <div id="log"></div>
</div>

<script>
const stocks = [
  { symbol: 'AAPL', name: 'Apple Inc', price: 185.42, base: 185, volatility: 0.018, history: [], sector: 'Tech' },
  { symbol: 'TSLA', name: 'Tesla Inc', price: 248.15, base: 250, volatility: 0.035, history: [], sector: 'Auto' },
  { symbol: 'NVDA', name: 'NVIDIA', price: 875.30, base: 880, volatility: 0.028, history: [], sector: 'Tech' },
  { symbol: 'AMZN', name: 'Amazon', price: 178.90, base: 180, volatility: 0.022, history: [], sector: 'Retail' },
  { symbol: 'MSFT', name: 'Microsoft', price: 415.60, base: 420, volatility: 0.016, history: [], sector: 'Tech' },
  { symbol: 'GOOGL', name: 'Alphabet', price: 162.25, base: 165, volatility: 0.020, history: [], sector: 'Tech' },
  { symbol: 'META', name: 'Meta', price: 512.80, base: 510, volatility: 0.026, history: [], sector: 'Tech' },
  { symbol: 'BTC', name: 'Bitcoin', price: 67250, base: 65000, volatility: 0.045, history: [], sector: 'Crypto' },
  { symbol: 'SPY', name: 'S&P 500 ETF', price: 512.40, base: 510, volatility: 0.012, history: [], sector: 'Index' },
  { symbol: 'XOM', name: 'Exxon Mobil', price: 118.75, base: 120, volatility: 0.019, history: [], sector: 'Energy' }
];

let portfolio = {
  cash: 10000,
  holdings: {}
};
stocks.forEach(s => portfolio.holdings[s.symbol] = 0);

let selectedSymbol = 'AAPL';
let tick = 0;
let day = 1;
let speed = 1;
let paused = false;
let intervalId = null;
let newsTimeout = null;

const newsEvents = [
  { text: "Fed signals rate cut — tech stocks surge", effect: { tech: 0.08 } },
  { text: "Supply chain disruption hits automakers", effect: { auto: -0.12 } },
  { text: "Bitcoin ETF approval rumors", effect: { crypto: 0.15 } },
  { text: "Oil prices spike on geopolitical tensions", effect: { energy: 0.10 } },
  { text: "Major tech earnings beat expectations", effect: { tech: 0.06 } },
  { text: "Inflation data higher than expected — markets dip", effect: { all: -0.04 } },
  { text: "AI breakthrough announced by NVIDIA", effect: { NVDA: 0.12 } },
  { text: "Tesla recalls vehicles — stock drops", effect: { TSLA: -0.10 } },
  { text: "Strong retail sales boost Amazon", effect: { AMZN: 0.07 } },
  { text: "Broad market rally on positive economic data", effect: { all: 0.05 } },
  { text: "Crypto exchange hack — Bitcoin plunges", effect: { BTC: -0.18 } },
  { text: "Microsoft cloud growth accelerates", effect: { MSFT: 0.09 } }
];

function init() {
  stocks.forEach(s => {
    s.history = Array(30).fill(s.price);
  });
  renderStocks();
  renderSelect();
  updateUI();
  log("Welcome to TERMINAL TRADER. Market is open.");
  log("Buy low, sell high. Reach $100,000 to win.");
  startSimulation();
}

function startSimulation() {
  if (intervalId) clearInterval(intervalId);
  intervalId = setInterval(() => {
    if (!paused) tickMarket();
  }, 1000 / speed);
}

function setSpeed(s) {
  speed = s;
  document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
  document.getElementById('speed' + s).classList.add('active');
  startSimulation();
}

function pauseResume() {
  paused = !paused;
  document.querySelector('.controls button:last-child').textContent = paused ? 'RESUME' : 'PAUSE';
}

function tickMarket() {
  tick++;
  if (tick % 60 === 0) day++;

  stocks.forEach(s => {
    const drift = 0.0001;
    const change = (Math.random() - 0.5 + drift) * s.volatility * s.price;
    s.price = Math.max(0.01, s.price + change);
    s.history.push(s.price);
    if (s.history.length > 60) s.history.shift();
  });

  if (Math.random() < 0.008) triggerNews();

  updateUI();
  if (getTotal() >= 100000) {
    log("*** CONGRATULATIONS! You reached $100,000! ***");
    paused = true;
  }
}

function triggerNews() {
  const event = newsEvents[Math.floor(Math.random() * newsEvents.length)];
  document.getElementById('news').textContent = "BREAKING: " + event.text;
  log("NEWS: " + event.text);

  stocks.forEach(s => {
    let multiplier = 1;
    if (event.effect.all) multiplier += event.effect.all;
    if (event.effect.tech && s.sector === 'Tech') multiplier += event.effect.tech;
    if (event.effect.auto && s.sector === 'Auto') multiplier += event.effect.auto;
    if (event.effect.crypto && s.sector === 'Crypto') multiplier += event.effect.crypto;
    if (event.effect.energy && s.sector === 'Energy') multiplier += event.effect.energy;
    if (event.effect[s.symbol]) multiplier += event.effect[s.symbol];
    s.price *= multiplier;
    s.price = Math.max(0.01, s.price);
  });

  if (newsTimeout) clearTimeout(newsTimeout);
  newsTimeout = setTimeout(() => {
    document.getElementById('news').textContent = "Market trading normally...";
  }, 8000);
}

function getHoldingsValue() {
  return stocks.reduce((sum, s) => sum + portfolio.holdings[s.symbol] * s.price, 0);
}

function getTotal() {
  return portfolio.cash + getHoldingsValue();
}

function updateUI() {
  document.getElementById('cash').textContent = portfolio.cash.toFixed(2);
  document.getElementById('holdings').textContent = getHoldingsValue().toFixed(2);
  document.getElementById('total').textContent = getTotal().toFixed(2);
  document.getElementById('day').textContent = day;
  renderStocks();
  drawChart();
  updateTradeInfo();
}

function renderStocks() {
  const container = document.getElementById('stocks');
  container.innerHTML = '';
  stocks.forEach(s => {
    const prev = s.history.length > 1 ? s.history[s.history.length - 2] : s.price;
    const change = s.price - prev;
    const pct = ((change / prev) * 100).toFixed(2);
    const card = document.createElement('div');
    card.className = 'stock-card' + (s.symbol === selectedSymbol ? ' selected' : '');
    card.onclick = () => selectStock(s.symbol);
    card.innerHTML = `
      <div class="symbol">${s.symbol}</div>
      <div class="price">$${s.price.toFixed(2)}</div>
      <div class="change ${change >= 0 ? 'positive' : 'negative'}">${change >= 0 ? '+' : ''}${pct}%</div>
      <div style="font-size:11px;opacity:0.7">${portfolio.holdings[s.symbol]} shares</div>
    `;
    container.appendChild(card);
  });
}

function renderSelect() {
  const sel = document.getElementById('stockSelect');
  sel.innerHTML = stocks.map(s => `<option value="${s.symbol}">${s.symbol} - ${s.name}</option>`).join('');
  sel.value = selectedSymbol;
}

function selectStock(sym) {
  selectedSymbol = sym;
  document.getElementById('stockSelect').value = sym;
  renderStocks();
  drawChart();
  updateTradeInfo();
}

function updateTradeInfo() {
  const stock = stocks.find(s => s.symbol === selectedSymbol);
  if (!stock) return;
  const maxShares = Math.floor(portfolio.cash / stock.price);
  document.getElementById('maxBuy').textContent = `Max buy: ${maxShares}`;
  document.getElementById('buyBtn').disabled = maxShares < 1;
  document.getElementById('sellBtn').disabled = portfolio.holdings[selectedSymbol] < 1;
}

function buy() {
  const qty = parseInt(document.getElementById('qty').value) || 1;
  const stock = stocks.find(s => s.symbol === selectedSymbol);
  const cost = qty * stock.price;
  if (cost > portfolio.cash) {
    log("Insufficient cash.");
    return;
  }
  portfolio.cash -= cost;
  portfolio.holdings[selectedSymbol] += qty;
  log(`BOUGHT ${qty} ${selectedSymbol} @ $${stock.price.toFixed(2)}`);
  updateUI();
}

function sell() {
  const qty = parseInt(document.getElementById('qty').value) || 1;
  if (portfolio.holdings[selectedSymbol] < qty) {
    log("Not enough shares.");
    return;
  }
  const stock = stocks.find(s => s.symbol === selectedSymbol);
  const proceeds = qty * stock.price;
  portfolio.cash += proceeds;
  portfolio.holdings[selectedSymbol] -= qty;
  log(`SOLD ${qty} ${selectedSymbol} @ $${stock.price.toFixed(2)}`);
  updateUI();
}

function drawChart() {
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const stock = stocks.find(s => s.symbol === selectedSymbol);
  if (!stock || stock.history.length < 2) return;

  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.offsetWidth * dpr;
  canvas.height = canvas.offsetHeight * dpr;
  ctx.scale(dpr, dpr);

  const w = canvas.offsetWidth;
  const h = canvas.offsetHeight;
  ctx.clearRect(0, 0, w, h);

  const data = stock.history;
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min || 1;

  ctx.strokeStyle = '#0f0';
  ctx.lineWidth = 2;
  ctx.beginPath();
  data.forEach((p, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((p - min) / range) * (h - 20) - 10;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Fill under line
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.closePath();
  ctx.fillStyle = 'rgba(0, 255, 0, 0.1)';
  ctx.fill();

  document.getElementById('chartLabel').textContent = `${stock.symbol} - $${stock.price.toFixed(2)}`;
}

function log(msg) {
  const logEl = document.getElementById('log');
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.textContent = `[${day}] ${msg}`;
  logEl.appendChild(entry);
  logEl.scrollTop = logEl.scrollHeight;
}

window.onload = init;
</script>
</body>
</html>
